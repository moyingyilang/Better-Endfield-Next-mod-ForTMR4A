[package]
name = "be-ir"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
publish = false
description = "BEM → ForTMR2 mod.toml/IR 转换（CRX：Rust 叶子，C ABI）"

[lib]
name = "be_ir"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "be-ir"
path = "src/bin/be-ir.rs"

[dependencies]
be-bem = { path = "../bem" }
efml-core = { path = "../../third_party/ForTMR2/native/crates/efml-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.0"
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
